<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Void Miner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Retire / Game Over Overlay -->
  <div id="retire-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-icon">⚛️</div>
      <h3>Run Retired</h3>
      <p>What would you like to do?</p>
      <div class="modal-dm"><span id="modal-dm-value">0</span> Dark Matter collected</div>
      <div class="modal-actions col">
        <button id="btn-retire-confirm">🏆 Submit Score &amp; Exit</button>
        <button id="btn-retire-reset" class="secondary">↩ Play Again (Reset)</button>
        <button id="btn-retire-cancel" class="ghost">Cancel</button>
      </div>
    </div>
  </div>

  <!-- HUD Header -->
  <header class="hud">
    <div class="hud-stat">
      <span class="hud-label">DARK MATTER</span>
      <span class="hud-value" id="dm-display">0</span>
    </div>
    <div class="hud-stat center">
      <span class="hud-label">PER SECOND</span>
      <span class="hud-value" id="gps-display">0</span>
    </div>
    <div class="hud-stat right">
      <span class="hud-label">PLAYER</span>
      <span class="hud-value player-name" id="player-name">—</span>
    </div>
  </header>

  <!-- Main Game Area -->
  <main class="game-area">

    <!-- Singularity Clickable -->
    <section class="singularity-section">
      <div class="singularity-wrapper">
        <div class="ring ring-3"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-1"></div>
        <button id="singularity" class="singularity" aria-label="Click to mine Dark Matter">
          <span class="singularity-core">⚛</span>
        </button>
      </div>
      <p class="click-hint">Click to Extract Dark Matter</p>
      <p class="dm-per-click">+<span id="click-power">1</span> DM / click</p>
    </section>

    <!-- Upgrades Panel -->
    <aside class="upgrades-panel">
      <h2 class="panel-title">UPGRADES</h2>
      <div id="upgrades-list" class="upgrades-list">
        <!-- Generated by JS -->
      </div>
      <button id="btn-retire" class="retire-btn">⏏ Retire &amp; Upload Score</button>
    </aside>

  </main>

  <script src="game.js"></script>
</body>

</html>
