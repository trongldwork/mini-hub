<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dino Runner</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #F1FAEE;
      font-family: 'Inter', system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    .game-container {
      position: relative;
      width: 480px;
      max-width: 100%;
      aspect-ratio: 16/9;
      background-color: #1a1a1a;
      border: 2px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      text-align: center;
      padding: 20px;
      transition: opacity 0.3s;
    }
    
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #4ade80;
      margin-bottom: 5px;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      font-size: 0.9rem;
      color: #A0A0A0;
      margin-bottom: 25px;
    }
    
    .score-summary {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
    }
    
    .btn-play {
      background-color: #4ade80;
      color: #121212;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
      transition: background-color 0.2s, transform 0.1s;
    }
    
    .btn-play:hover {
      background-color: #64e393;
    }
    
    .btn-play:active {
      transform: scale(0.95);
    }
    
    .mobile-tip {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="game-container" id="game-wrapper">
    <canvas id="gameCanvas" width="640" height="360"></canvas>
    
    <!-- Start / Game Over Overlay -->
    <div id="overlay" class="overlay">
      <div id="game-title" class="title">DINO RUNNER</div>
      <div id="game-subtitle" class="subtitle">Press Space or Tap Screen to Jump</div>
      <div id="score-display" class="score-summary" style="display: none;">
        Distance: <span id="final-score" style="color: #4ade80;">0</span>m
      </div>
      <button id="btn-action" class="btn-play">START GAME</button>
      <div class="mobile-tip">Works with Spacebar, Left Click, or Screen Tap</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
